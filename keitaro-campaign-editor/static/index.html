<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keitaro Campaign Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 24px 60px;
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
      }

      /* Top bar */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        background: #fff;
        padding: 14px 16px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 16px;
      }
      .topbar label {
        font-weight: 700;
        font-size: 13px;
        color: #374151;
      }
      .campaign-picker {
        position: relative;
        flex: 1 1 280px;
        min-width: 240px;
      }
      .campaign-picker input {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #9ca3af;
        border-radius: 4px;
        font: inherit;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .campaign-title {
        font-size: 18px;
        font-weight: 700;
        margin-right: auto;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        font: 700 12px/1.2 inherit;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background: #fff;
        color: #1f2937;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover:not(:disabled) {
        background: #f1f5f9;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: #1d4ed8;
      }
      .btn-danger-outline {
        background: #fff;
        border-color: #d1d5db;
        color: #111827;
      }
      .btn-danger-outline:hover:not(:disabled) {
        background: #fee2e2;
        border-color: #fca5a5;
        color: #991b1b;
      }
      .btn-bring-back {
        background: #fff;
        border-color: #9ca3af;
        color: #1f2937;
      }
      .btn-bring-back:hover:not(:disabled) {
        background: #dcfce7;
        border-color: #86efac;
        color: #166534;
      }

      #status-banner {
        margin-bottom: 12px;
        padding: 10px 14px;
        border-radius: 4px;
        font-size: 13px;
        display: none;
      }
      #status-banner.ok {
        display: block;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
      }
      #status-banner.err {
        display: block;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      /* Stream card / table */
      .stream-card {
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 16px;
        overflow: visible;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      .stream-card.dirty {
        background: #fefce8;
        border-color: #eab308;
      }
      .stream-header {
        padding: 10px 14px;
        background: #f3f4f6;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        border-radius: 6px 6px 0 0;
      }
      .stream-card.dirty .stream-header {
        background: #fef9c3;
        border-bottom-color: #fde047;
      }
      .stream-name {
        font-weight: 700;
        font-size: 14px;
      }
      .stream-meta {
        font-size: 12px;
        color: #6b7280;
      }
      .stream-dirty-bar {
        display: none;
        padding: 8px 14px;
        background: #fef9c3;
        border-bottom: 1px solid #fde047;
        align-items: center;
        gap: 8px;
      }
      .stream-card.dirty .stream-dirty-bar {
        display: flex;
      }
      .share-warning {
        font-size: 12px;
        font-weight: 600;
        color: #b91c1c;
        margin-left: 8px;
      }

      table.offers-table {
        width: 100%;
        border-collapse: collapse;
      }
      table.offers-table th {
        text-align: left;
        padding: 8px 14px;
        font-size: 12px;
        color: #4b5563;
        border-bottom: 1px solid #e5e7eb;
        background: rgba(0, 0, 0, 0.02);
      }
      table.offers-table td {
        padding: 10px 14px;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: middle;
      }
      tr.offer-removed {
        background-color: #f3f4f6;
      }
      tr.offer-removed td {
        color: #9ca3af;
      }
      .removed-tag {
        display: inline-block;
        margin-left: 6px;
        font-size: 12px;
        color: #9ca3af;
        font-style: italic;
      }

      .share-cell {
        white-space: nowrap;
        width: 120px;
      }
      .share-value {
        color: #2563eb;
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline dotted;
        background: none;
        border: 0;
        padding: 2px 4px;
        font-size: 14px;
      }
      tr.offer-removed .share-value {
        color: #9ca3af;
        cursor: default;
        text-decoration: none;
      }
      .share-input {
        width: 58px;
        padding: 2px 5px;
        font: 700 13px inherit;
        border: 1px solid #2563eb;
        border-radius: 3px;
      }
      .pin-btn {
        background: none;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        padding: 2px 5px;
        margin-left: 4px;
        opacity: 0.35;
        transition:
          opacity 0.15s,
          background-color 0.15s;
      }
      .pin-btn:hover:not(:disabled) {
        opacity: 0.8;
        background: rgba(0, 0, 0, 0.05);
      }
      .pin-btn.pinned {
        opacity: 1;
        background: #dbeafe;
        border-color: #93c5fd;
      }
      .pin-btn:disabled {
        opacity: 0.18;
        cursor: default;
      }

      .actions-cell {
        width: 150px;
        text-align: right;
        white-space: nowrap;
      }

      /* Add offer row */
      .add-bar {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        align-items: center;
      }
      .combo {
        position: relative;
        flex: 1;
        max-width: 460px;
      }
      .combo input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #9ca3af;
        border-radius: 4px;
        font: inherit;
        background: #fff;
      }
      .options {
        position: absolute;
        z-index: 50;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 260px;
        overflow-y: auto;
        margin: 2px 0 0;
        padding: 0;
        list-style: none;
        background: #fff;
        border: 1px solid #9ca3af;
        border-radius: 4px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      }
      .options[hidden] {
        display: none;
      }
      .options li {
        padding: 7px 10px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 13px;
      }
      .options li:hover,
      .options li.active {
        background: #2563eb;
        color: #fff;
      }
      .options li.note {
        color: #6b7280;
        cursor: default;
        background: #fff;
      }

      .stream-compact {
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 10px;
        color: #374151;
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #6b7280;
        background: #fff;
        border: 1px dashed #cbd5e1;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <label for="campaign-input">Кампания:</label>
        <div class="campaign-picker">
          <input
            id="campaign-input"
            type="text"
            placeholder="Выберите кампанию из списка или введите ID и нажмите Enter..."
            autocomplete="off"
          />
          <ul id="campaign-list" class="options" hidden></ul>
        </div>
      </div>

      <div id="status-banner" role="status"></div>

      <div id="workspace" hidden>
        <div class="toolbar">
          <div id="campaign-title" class="campaign-title"></div>
          <button id="fetch-btn" class="btn" type="button">
            ⬇ Fetch streams from KT
          </button>
          <a
            id="view-kt-btn"
            class="btn"
            href="#"
            target="_blank"
            rel="noopener"
            >↗ View in KT</a
          >
        </div>

        <div id="streams-container"></div>
      </div>

      <div id="empty-placeholder" class="empty-state">
        Выберите кампанию сверху, чтобы загрузить и отредактировать её потоки.
      </div>
    </div>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);

        const campaignInput = $("campaign-input");
        const campaignList = $("campaign-list");
        const statusBanner = $("status-banner");
        const workspace = $("workspace");
        const emptyPlaceholder = $("empty-placeholder");
        const campaignTitle = $("campaign-title");
        const fetchBtn = $("fetch-btn");
        const viewKtBtn = $("view-kt-btn");
        const streamsContainer = $("streams-container");

        let campaignsCache = [];
        let currentCampaign = null;
        let streamStates = new Map();

        function showStatus(kind, text) {
          statusBanner.className = kind;
          statusBanner.textContent = text;
        }
        function clearStatus() {
          statusBanner.className = "";
          statusBanner.textContent = "";
        }

        async function api(path, options = {}) {
          const res = await fetch(path, {
            headers: { "Content-Type": "application/json" },
            ...options,
          });
          let data = null;
          try {
            data = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const msg = (data && data.detail) || `Ошибка HTTP ${res.status}`;
            throw new Error(
              typeof msg === "string" ? msg : JSON.stringify(msg),
            );
          }
          return data;
        }

        // ---------- Логика пересчёта процентов  ----------
        function recalculateShares(offers) {
          const active = offers.filter((o) => !o.is_removed);
          for (const o of offers) {
            if (o.is_removed) {
              o.share = 0;
              o.is_pinned = false;
            }
          }
          const pinned = active.filter((o) => o.is_pinned);
          const unpinned = active.filter((o) => !o.is_pinned);
          const pinnedSum = pinned.reduce((acc, o) => acc + o.share, 0);
          const remaining = Math.max(0, 100 - pinnedSum);

          if (unpinned.length > 0) {
            const base = Math.floor(remaining / unpinned.length);
            const rem = remaining % unpinned.length;
            unpinned.forEach((o, idx) => {
              o.share = base + (idx < rem ? 1 : 0);
            });
          }
        }

        function activeTotalShare(offers) {
          return offers
            .filter((o) => !o.is_removed)
            .reduce((acc, o) => acc + o.share, 0);
        }

        function cloneOffers(offers) {
          return offers.map((o) => ({ ...o }));
        }

        function isStreamDirty(st) {
          const normalize = (offers) =>
            offers
              .filter((o) => !o.is_removed)
              .map((o) => `${o.offer_id}:${o.share}`)
              .sort()
              .join("|");
          return normalize(st.saved.offers) !== normalize(st.draftOffers);
        }

        // ---------- Выбор кампании ----------
        async function loadCampaignsList(query = "") {
          try {
            const params = new URLSearchParams({ q: query, limit: "50" });
            campaignsCache = await api(`/api/campaigns?${params}`);
            renderCampaignOptions(campaignsCache);
          } catch (err) {
            campaignList.innerHTML = `<li class="note">${err.message}</li>`;
            campaignList.hidden = false;
          }
        }

        function renderCampaignOptions(rows) {
          if (!rows.length) {
            campaignList.innerHTML = `<li class="note">Кампании не найдены</li>`;
            campaignList.hidden = false;
            return;
          }
          campaignList.replaceChildren(
            ...rows.map((c) => {
              const li = document.createElement("li");
              li.textContent = `#${c.id} — ${c.name}`;
              li.addEventListener("mousedown", (e) => {
                e.preventDefault();
                campaignInput.value = `#${c.id} — ${c.name}`;
                campaignList.hidden = true;
                openCampaign(c.id, false);
              });
              return li;
            }),
          );
          campaignList.hidden = false;
        }

        let campTimer = null;
        campaignInput.addEventListener("focus", () => loadCampaignsList(""));
        campaignInput.addEventListener("input", () => {
          clearTimeout(campTimer);
          campTimer = setTimeout(
            () => loadCampaignsList(campaignInput.value.trim()),
            200,
          );
        });
        campaignInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            const raw = campaignInput.value.trim();
            const numMatch = raw.match(/^#?(\d+)/);
            if (numMatch) {
              campaignList.hidden = true;
              openCampaign(parseInt(numMatch[1], 10), false);
            }
          } else if (e.key === "Escape") {
            campaignList.hidden = true;
          }
        });
        campaignInput.addEventListener("blur", () => {
          campaignList.hidden = true;
        });

        // ---------- Загрузка / Fetch потоков ----------
        async function openCampaign(campaignId, forceFetch) {
          clearStatus();
          fetchBtn.disabled = true;
          try {
            const data = forceFetch
              ? await api(`/api/campaigns/${campaignId}/fetch`, {
                  method: "POST",
                })
              : await api(`/api/campaigns/${campaignId}/streams`);

            currentCampaign = data.campaign;
            campaignInput.value = `#${data.campaign.id} — ${data.campaign.name}`;
            campaignTitle.textContent = `${data.campaign.name} (#${data.campaign.id})`;
            viewKtBtn.href = data.campaign.keitaro_admin_url || "#";

            streamStates = new Map();
            for (const s of data.streams) {
              streamStates.set(s.id, {
                saved: s,
                draftOffers: cloneOffers(s.offers),
                dirty: false,
              });
            }

            emptyPlaceholder.hidden = true;
            workspace.hidden = false;
            renderAllStreams();
            if (forceFetch) {
              showStatus("ok", "Потоки обновлены из Keitaro");
            }
          } catch (err) {
            showStatus("err", err.message);
          } finally {
            fetchBtn.disabled = false;
          }
        }

        fetchBtn.addEventListener("click", () => {
          if (currentCampaign) openCampaign(currentCampaign.id, true);
        });

        // ---------- Рендеринг потоков ----------
        function renderAllStreams() {
          streamsContainer.replaceChildren();
          const all = [...streamStates.values()];
          if (!all.length) {
            streamsContainer.innerHTML = `<div class="empty-state">У этой кампании нет потоков</div>`;
            return;
          }

          const withOffers = all.filter((st) => st.saved.has_offers);
          const withoutOffers = all.filter((st) => !st.saved.has_offers);

          for (const st of withOffers) {
            streamsContainer.appendChild(buildEditableStreamCard(st));
          }
          for (const st of withoutOffers) {
            streamsContainer.appendChild(buildCompactStreamRow(st.saved));
          }
        }

        function buildCompactStreamRow(stream) {
          const div = document.createElement("div");
          div.className = "stream-compact";
          div.innerHTML = `
            <span class="stream-name">Stream: ${escapeHtml(stream.name)} (#${stream.position})</span>
            <span class="stream-meta">filter by ${escapeHtml(stream.filter_summary)}, stream_id ${stream.id}</span>
          `;
          return div;
        }

        function buildEditableStreamCard(st) {
          const stream = st.saved;
          const card = document.createElement("div");
          card.className = "stream-card" + (st.dirty ? " dirty" : "");
          card.dataset.streamId = String(stream.id);

          const header = document.createElement("div");
          header.className = "stream-header";
          header.innerHTML = `
            <span class="stream-name">Stream: ${escapeHtml(stream.name)} (#${stream.position})</span>
            <span class="stream-meta">filter by ${escapeHtml(stream.filter_summary)}, stream_id ${stream.id}</span>
          `;
          card.appendChild(header);

          const dirtyBar = document.createElement("div");
          dirtyBar.className = "stream-dirty-bar";

          const activeOffers = st.draftOffers.filter((o) => !o.is_removed);
          const totalShare = activeTotalShare(st.draftOffers);
          const isValidTotal = activeOffers.length === 0 || totalShare === 100;

          const pushBtn = document.createElement("button");
          pushBtn.type = "button";
          pushBtn.className = "btn btn-primary";
          pushBtn.textContent = "⬆ Push to KT";
          pushBtn.disabled = !isValidTotal;
          pushBtn.addEventListener("click", () =>
            pushStream(stream.id, pushBtn),
          );

          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn";
          cancelBtn.textContent = "✕ Cancel";
          cancelBtn.addEventListener("click", () => {
            st.draftOffers = cloneOffers(st.saved.offers);
            st.dirty = false;
            renderAllStreams();
          });

          dirtyBar.appendChild(pushBtn);
          dirtyBar.appendChild(cancelBtn);

          if (!isValidTotal) {
            const warn = document.createElement("span");
            warn.className = "share-warning";
            warn.textContent = `Сумма долей должна быть 100% (сейчас ${totalShare}%)`;
            dirtyBar.appendChild(warn);
          }
          card.appendChild(dirtyBar);

          // Таблица офферов
          const table = document.createElement("table");
          table.className = "offers-table";
          table.innerHTML = `
            <thead>
              <tr>
                <th>Offer</th>
                <th>Share</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
          `;
          const tbody = document.createElement("tbody");

          const orderedOffers = [...st.draftOffers].sort(
            (a, b) => Number(a.is_removed) - Number(b.is_removed),
          );
          for (const offer of orderedOffers) {
            tbody.appendChild(buildOfferRow(st, offer));
          }

          table.appendChild(tbody);
          card.appendChild(table);

          // Панель добавления оффера (выпадающий поиск + кнопка ADD)
          card.appendChild(buildAddOfferBar(st));

          return card;
        }

        function buildOfferRow(st, offer) {
          const tr = document.createElement("tr");
          if (offer.is_removed) tr.className = "offer-removed";

          // Название оффера
          const nameTd = document.createElement("td");
          const labelText = offer.offer_name.startsWith(`${offer.offer_id} `)
            ? offer.offer_name
            : `${offer.offer_id} ${offer.offer_name}`;
          nameTd.textContent = labelText;
          if (offer.is_removed) {
            const tag = document.createElement("span");
            tag.className = "removed-tag";
            tag.textContent = "(removed)";
            nameTd.appendChild(tag);
          }

          // Доля + булавка
          const shareTd = document.createElement("td");
          shareTd.className = "share-cell";

          const shareBtn = document.createElement("button");
          shareBtn.type = "button";
          shareBtn.className = "share-value";
          shareBtn.textContent = `${offer.share}%`;
          if (!offer.is_removed) {
            shareBtn.title = "Нажмите, чтобы задать процент вручную";
            shareBtn.addEventListener("click", () =>
              startInlineShareEdit(st, offer, shareTd),
            );
          }
          shareTd.appendChild(shareBtn);

          const pinBtn = document.createElement("button");
          pinBtn.type = "button";
          pinBtn.className = "pin-btn" + (offer.is_pinned ? " pinned" : "");
          pinBtn.textContent = "📌";
          pinBtn.disabled = offer.is_removed;
          pinBtn.title = offer.is_pinned
            ? "Открепить процент"
            : "Закрепить процент (не будет меняться при добавлении/удалении)";
          pinBtn.addEventListener("click", () => {
            const nextPinned = !offer.is_pinned;
            offer.is_pinned = nextPinned;
            const savedOffer = st.saved.offers.find(
              (o) => o.offer_id === offer.offer_id,
            );
            if (savedOffer) {
              savedOffer.is_pinned = nextPinned;
              api(`/api/streams/${st.saved.id}/offers/${offer.offer_id}/pin`, {
                method: "PATCH",
                body: JSON.stringify({ is_pinned: nextPinned }),
              }).catch(() => {});
            }
            renderAllStreams();
          });
          shareTd.appendChild(pinBtn);

          // Действия: REMOVE / BRING BACK
          const actTd = document.createElement("td");
          actTd.className = "actions-cell";

          if (!offer.is_removed) {
            const rmBtn = document.createElement("button");
            rmBtn.type = "button";
            rmBtn.className = "btn btn-danger-outline";
            rmBtn.textContent = "🗑 Remove";
            rmBtn.addEventListener("click", () => {
              offer.is_removed = true;
              offer.is_pinned = false;
              offer.share = 0;
              recalculateShares(st.draftOffers);
              st.dirty = isStreamDirty(st);
              renderAllStreams();
            });
            actTd.appendChild(rmBtn);
          } else {
            const backBtn = document.createElement("button");
            backBtn.type = "button";
            backBtn.className = "btn btn-bring-back";
            backBtn.textContent = "↩ Bring back";
            backBtn.addEventListener("click", () => {
              offer.is_removed = false;
              offer.is_pinned = false;
              recalculateShares(st.draftOffers);
              st.dirty = isStreamDirty(st);
              renderAllStreams();
            });
            actTd.appendChild(backBtn);
          }

          tr.append(nameTd, shareTd, actTd);
          return tr;
        }

        function startInlineShareEdit(st, offer, shareTd) {
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.max = "100";
          input.value = String(offer.share);
          input.className = "share-input";

          const commit = () => {
            const val = parseInt(input.value, 10);
            if (
              !Number.isNaN(val) &&
              val >= 0 &&
              val <= 100 &&
              val !== offer.share
            ) {
              offer.share = val;
              offer.is_pinned = true;
              recalculateShares(st.draftOffers);
              st.dirty = isStreamDirty(st);
            }
            renderAllStreams();
          };

          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              commit();
            } else if (e.key === "Escape") {
              renderAllStreams();
            }
          });
          input.addEventListener("blur", commit);

          shareTd.replaceChildren(input);
          input.focus();
          input.select();
        }

        function buildAddOfferBar(st) {
          const bar = document.createElement("div");
          bar.className = "add-bar";

          const combo = document.createElement("div");
          combo.className = "combo";

          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Поиск оффера для добавления...";
          input.autocomplete = "off";

          const list = document.createElement("ul");
          list.className = "options";
          list.hidden = true;

          let pickedOffer = null;
          let timer = null;
          let seq = 0;

          const offerLabel = (o) =>
            o.name.startsWith(`${o.id} `) || o.name === String(o.id)
              ? o.name
              : `${o.id} ${o.name}`;

          async function loadOffers(q) {
            const mine = ++seq;
            try {
              const params = new URLSearchParams({ q, limit: "50" });
              const rows = await api(`/api/offers?${params}`);
              if (mine !== seq) return;
              if (!rows.length) {
                list.innerHTML = `<li class="note">Ничего не найдено</li>`;
                list.hidden = false;
                return;
              }
              list.replaceChildren(
                ...rows.map((o) => {
                  const li = document.createElement("li");
                  li.textContent = offerLabel(o);
                  li.title = offerLabel(o);
                  li.addEventListener("mousedown", (e) => {
                    e.preventDefault();
                    pickedOffer = o;
                    input.value = offerLabel(o);
                    list.hidden = true;
                  });
                  return li;
                }),
              );
              list.hidden = false;
            } catch (err) {
              if (mine === seq) {
                list.innerHTML = `<li class="note">${err.message}</li>`;
                list.hidden = false;
              }
            }
          }

          input.addEventListener("focus", () =>
            loadOffers(pickedOffer ? "" : input.value.trim()),
          );
          input.addEventListener("input", () => {
            pickedOffer = null;
            clearTimeout(timer);
            timer = setTimeout(() => loadOffers(input.value.trim()), 200);
          });
          input.addEventListener("blur", () => {
            list.hidden = true;
          });

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "btn";
          addBtn.textContent = "Add";
          addBtn.addEventListener("click", () => {
            if (!pickedOffer) {
              showStatus("err", "Выберите оффер из выпадающего списка");
              input.focus();
              return;
            }
            clearStatus();
            const existing = st.draftOffers.find(
              (o) => o.offer_id === pickedOffer.id,
            );
            if (existing) {
              if (!existing.is_removed) {
                showStatus(
                  "err",
                  `Оффер #${pickedOffer.id} уже есть в этом потоке`,
                );
                return;
              }
              existing.is_removed = false;
              existing.is_pinned = false;
            } else {
              st.draftOffers.push({
                offer_id: pickedOffer.id,
                offer_name: pickedOffer.name,
                share: 0,
                is_pinned: false,
                is_removed: false,
              });
            }
            recalculateShares(st.draftOffers);
            st.dirty = isStreamDirty(st);
            renderAllStreams();
          });

          combo.append(input, list);
          bar.append(combo, addBtn);
          return bar;
        }

        // ---------- Push на сервер ----------
        async function pushStream(streamId, btn) {
          const st = streamStates.get(streamId);
          if (!st) return;
          clearStatus();
          btn.disabled = true;
          btn.textContent = "Pushing…";
          try {
            const updated = await api(`/api/streams/${streamId}/push`, {
              method: "POST",
              body: JSON.stringify({ offers: st.draftOffers }),
            });
            st.saved = updated;
            st.draftOffers = cloneOffers(updated.offers);
            st.dirty = false;
            renderAllStreams();
            showStatus(
              "ok",
              `Поток "${updated.name}" успешно сохранён в Keitaro`,
            );
          } catch (err) {
            showStatus("err", err.message);
            btn.disabled = false;
            btn.textContent = "⬆ Push to KT";
          }
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
      })();
    </script>
  </body>
</html>
